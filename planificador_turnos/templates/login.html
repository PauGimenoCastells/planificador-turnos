<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Planificador de Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-6 font-sans">
    <main class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-[#00CCFF] mb-2 tracking-tight">Iniciar sesión</h1>
            <p class="text-slate-600 text-sm">Accede a tu cuenta de Planificador de Turnos</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login/" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00CCFF] focus:border-transparent transition"
                       placeholder="Tu nombre de usuario">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00CCFF] focus:border-transparent transition"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-[#00CCFF] hover:opacity-90 text-slate-900 font-semibold rounded-lg shadow-sm transition">
                Iniciar sesión
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="/" class="text-slate-500 hover:text-slate-800 transition">← Volver al inicio</a>
        </div>
    </main>
</body>
</html>
