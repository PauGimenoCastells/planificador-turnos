<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-6 font-sans">
    <main class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
        <h1 class="text-3xl font-extrabold text-[#00CCFF] mb-3 tracking-tight">Planificador de Turnos</h1>
        <p class="text-slate-600 mb-6 text-base leading-relaxed">
            Sistema de planificación académica y gestión de turnos laborales.
        </p>
        <div class="inline-flex items-center px-4 py-2 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-full text-sm font-semibold mb-6">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full mr-2 animate-pulse"></span>
            Servidor activo · SQLite WAL
        </div>

        {% if user.is_authenticated %}
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
            <p class="text-base font-medium text-slate-700 mb-3">Hola, {{ user.username }}</p>
            <div class="flex justify-center gap-3">
                <a href="/logout/" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold rounded-lg shadow-sm transition">
                    Cerrar sesión
                </a>
            </div>
        </div>
        {% else %}
        <div class="flex justify-center gap-4">
            <a href="/login/" class="px-5 py-2.5 bg-[#00CCFF] hover:opacity-90 text-slate-900 font-semibold rounded-lg shadow-sm transition">
                Iniciar sesión
            </a>
        </div>
        {% endif %}
    </main>
</body>
</html>
